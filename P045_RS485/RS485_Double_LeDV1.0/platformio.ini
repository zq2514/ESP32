; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; 公共环境配置（所有环境共用）
[env]
platform = espressif32
board = esp32dev
framework = arduino

; 主站固件：只编译 main_master.cpp
[env:master]
build_src_filter = +<main_master.cpp>

; ---- 从站固件：只编译 main_slave.cpp ----
; 每块从站一个环境，用 build_flags 指定唯一地址（0x01~0xFE）。
; 新增一块从站：复制一个 [env:slave_XX] 段，改地址即可，源码无需改动。
[env:slave_01]
build_src_filter = +<main_slave.cpp>
build_flags = -DSLAVE_ADDR=0x01

[env:slave_02]
build_src_filter = +<main_slave.cpp>
build_flags = -DSLAVE_ADDR=0x02

[env:slave_03]
build_src_filter = +<main_slave.cpp>
build_flags = -DSLAVE_ADDR=0x03

; 常用命令：
;   pio run -e master             # 编译主站
;   pio run -e slave_01           # 编译 1 号从站
;   pio run -e master -t upload   # 烧录主站
;   pio run -e slave_02 -t upload # 烧录 2 号从站
